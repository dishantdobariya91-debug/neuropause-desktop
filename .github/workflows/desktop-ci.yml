name: desktop-ci

# TD-4a (GA blocker): per-PR desktop CI. Both desktop suites are headless, so
# they run on ubuntu and gate every change to the desktop app or shared types.
#
# P13C ROUND 17g — the UI suite was added here after fifteen rounds of security
# certification ran against it while it was red. This comment previously read
# "not the Electron UI", which was true of Electron and not true of `test:ui`:
# that suite is jsdom + Testing Library, it mounts real components, and it runs
# on ubuntu in under four seconds. It was excluded on a distinction that did not
# apply to it, so `vitest run` (764 files) was the only gate and the ten
# mounted-component tests ran in no workflow and no release. Two breakages sat
# in it undetected — Round 2's tenancy binding and Round 17's D-5 channel move.
# A suite nothing runs is not a gate; it is documentation that looks like one.
#
# P13C ROUND 17i — and adding a step HERE was half a fix. The release workflows
# do not run this file; they run `test:release`, which runs each workspace's own
# `test` script, so a signed artifact could still ship with the UI suite unrun.
# The step below is therefore gone and `@neuropause/desktop`'s `test` script
# runs BOTH configs. Every caller — this workflow, `test:release`, a developer
# typing `npm test`, and whatever workflow someone adds next — now gets the
# whole suite without having to know it exists. A gate that each caller must
# remember to invoke is the same defect as no gate, one indirection later.

on:
  push:
    paths:
      - 'apps/desktop/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/shared/**'

# S131 — least privilege. This job only reads the repo and runs tests; it needs no write scopes on the
# GITHUB_TOKEN. Declared explicitly so a future step cannot silently inherit broad default permissions.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Typecheck (desktop)
        run: npm run typecheck -w @neuropause/desktop
      - name: Lint (desktop)
        run: npx eslint apps/desktop --max-warnings 0
      - name: Test (desktop — node suite + mounted components)
        run: npm run test -w @neuropause/desktop
      - name: Build (desktop)
        run: npm run build -w @neuropause/desktop
      # S131 — supply-chain trust. SBOM + verification are deterministic (offline fold over the lockfile);
      # the packaged-content assertion runs on the freshly-built out/** (no electron-builder needed).
      - name: SBOM — generate + verify (CycloneDX, corresponds to lockfile)
        run: npm run verify:sbom -w @neuropause/desktop
      - name: Packaged-content assertion (out/** carries no prohibited material)
        run: npm run verify:packaged -w @neuropause/desktop
      - name: Upload SBOM + provenance
        uses: actions/upload-artifact@v4
        with:
          name: desktop-sbom
          path: apps/desktop/dist-sbom/
          if-no-files-found: error
      # S131 — dependency vulnerability scan. This SURFACES the current advisory posture (full tree + a
      # production-dependency high+ view) on every PR; it is REPORT-ONLY by design and does not gate.
      # Rationale (recorded in SESSION131 cert §Vuln-scan): (1) `npm audit` at the workspace root spans ALL
      # workspaces, so a backend-only advisory (e.g. the express/body-parser/qs DoS present at S131) would
      # otherwise fail DESKTOP CI for a package the Electron app never ships — wrong coupling; (2) choosing
      # a severity threshold that BLOCKS a merge is a release-policy decision the repo has not made, and
      # S131 does not invent policy. Dependabot (.github/dependabot.yml) provides the ongoing update stream;
      # a gating threshold + per-workspace scoping is the recommended follow-up remediation slice.
      - name: Dependency vulnerability scan — full tree (report)
        run: npm audit --audit-level=info || true
      - name: Dependency vulnerability scan — production deps high+ (report)
        run: npm audit --omit=dev --audit-level=high || true
